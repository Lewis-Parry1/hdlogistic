name: pre-commit

on:
  push:    
  pull_request:
  
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true 

      - name: Set up Python
        run: uv python install 3.12

      - name: Ensure pip is available
        run: uv run python -m ensurepip --upgrade

      - name: Upgrade pip
        run: uv run python -m pip install --upgrade pip

      - name: Install development dependencies
        run: uv run python -m pip install -e .[dev]

      - name: Run pre-commit hooks
        run: uv run python -m pre_commit run --all-files