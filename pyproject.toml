[project]
name = "to-be-titled"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy <= 2",
    "scipy",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "uv",
    "scipy-stubs",
    "pre-commit",
    "sphinx",
]
experiments = [
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort (import sorting)
# N: pep8-naming, UP: pyupgrade (keeps syntax modern)
select = ["E", "F", "I", "N", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "*.plugins.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/to_be_titled"]

[tool.pytest.ini_options]
markers = [
    "candes_sur: tests comparing solver output against Candes & Sur Table 13",
    "brglm2: tests comparing output of any functions to output of brglm2",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]