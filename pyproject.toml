[project]
name = "to-be-titled"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy <= 2",
    "scipy",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "uv",
    "scipy-stubs",
    "pre-commit"
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort (import sorting)
# N: pep8-naming, UP: pyupgrade (keeps syntax modern)
select = ["E", "F", "I", "N", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "*.plugins.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/to_be_titled"]
